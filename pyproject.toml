[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqltoolkit"
version = "0.1.0"
description = "A toolkit for safe and structured SQL operations"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amogha Hegde" }]

keywords = ["sql", "database", "postgresql", "oracle", "mysql", "mssql", "sqlite", "toolkit"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "sqlalchemy>=2.0.48",
    "alembic>=1.18.4",
    "alembic-postgresql-enum>=1.10.0",
    "alembic-utils>=0.8.8",
    "pytz",
    "PyYAML>=6.0"
]

[project.optional-dependencies]

postgresql = [
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.1"
]

oracle = [
    "oracledb>=3.4.2"
]

mysql = [
    "pymysql>=1.1.2",
    "aiomysql>=0.2.0"
]

mssql = [
    "python-tds>=1.17.1",
    "pyodbc>=5.3.0",
    "aioodbc>=0.5.0"
]

sqlite = [
    "aiosqlite>=0.20.0"
]

all = [
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.1",
    "oracledb>=3.4.2",
    "pymysql>=1.1.2",
    "aiomysql>=0.2.0",
    "python-tds>=1.17.1",
    "pyodbc>=5.3.0",
    "aioodbc>=0.5.0",
    "aiosqlite>=0.20.0"
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build",
    "twine"
]

[project.urls]
Homepage = "https://github.com/Amogha-Hegde/sqltoolkit"
Repository = "https://github.com/Amogha-Hegde/sqltoolkit"
Issues = "https://github.com/Amogha-Hegde/sqltoolkit/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqltoolkit*"]

[tool.setuptools]
include-package-data = true
