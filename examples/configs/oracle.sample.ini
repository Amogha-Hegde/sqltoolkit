; Oracle sample config for sqltoolkit.
; - session_settings: ALTER SESSION SET ... statements on connect
; - engine_options: SQLAlchemy create_engine()/pool kwargs

[databases.oracle.default.readwrite]
username = app_user
password = secret
host = localhost
port = 1521
service_name = FREEPDB1

[databases.oracle.default.readwrite.session_settings]
; These become ALTER SESSION SET ....
time_zone = UTC
nls_date_format = YYYY-MM-DD
nls_timestamp_format = YYYY-MM-DD HH24:MI:SS

[databases.oracle.default.readwrite.engine_options]
pool_size = 10
max_overflow = 20
pool_pre_ping = true

[databases.oracle.default.readonly]
username = readonly_user
password = secret
host = localhost
port = 1521
service_name = FREEPDB1

[databases.oracle.default.readonly.session_settings]
time_zone = UTC
nls_date_format = YYYY-MM-DD

[databases.oracle.default.readonly.engine_options]
pool_size = 5
max_overflow = 10
pool_pre_ping = true
