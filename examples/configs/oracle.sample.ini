; Oracle sample config for sqltoolkit.
; - session_settings: ALTER SESSION SET ... statements on connect
; - engine_options: SQLAlchemy create_engine()/pool kwargs

[databases.oracle.default.primary]
username = app_user
password = secret
host = localhost
port = 1521
service_name = FREEPDB1

[databases.oracle.default.primary.session_settings]
; These become ALTER SESSION SET ....
time_zone = UTC
nls_date_format = YYYY-MM-DD
nls_timestamp_format = YYYY-MM-DD HH24:MI:SS

[databases.oracle.default.primary.engine_options]
pool_size = 10
max_overflow = 20
pool_pre_ping = true

[databases.oracle.default.replica]
username = replica_user
password = secret
host = localhost
port = 1521
service_name = FREEPDB1

[databases.oracle.default.replica.session_settings]
time_zone = UTC
nls_date_format = YYYY-MM-DD

[databases.oracle.default.replica.engine_options]
pool_size = 5
max_overflow = 10
pool_pre_ping = true
