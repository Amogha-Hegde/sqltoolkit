; PostgreSQL sample config for sqltoolkit.
; - database_options: connection URL/query parameters
; - session_settings: per-connection PostgreSQL settings applied on connect
; - engine_options: SQLAlchemy create_engine()/pool kwargs

[databases.postgresql.primary]
db_url = postgresql+psycopg://app_user:secret@localhost:5432/app

[databases.postgresql.primary.database_options]
; application_name is a PostgreSQL/libpq connection parameter.
application_name = sqltoolkit

[databases.postgresql.primary.session_settings]
; These become SELECT pg_catalog.set_config(...).
search_path = app, public
statement_timeout = 30000
lock_timeout = 5000
idle_in_transaction_session_timeout = 60000
deadlock_timeout = 1000
default_transaction_isolation = read committed
default_transaction_read_only = false
default_transaction_deferrable = false
jit = false
max_parallel_workers_per_gather = 2
work_mem = 64MB
maintenance_work_mem = 256MB
random_page_cost = 1.1
effective_cache_size = 4GB
log_min_duration_statement = 250
TimeZone = UTC
DateStyle = ISO, MDY
row_security = true

[databases.postgresql.primary.engine_options]
; These are SQLAlchemy engine/pool options, not database settings.
pool_size = 10
max_overflow = 20
pool_pre_ping = true
pool_recycle = 1800
pool_use_lifo = true

[databases.postgresql.replica]
db_url = postgresql+psycopg://replica_user:secret@localhost:5432/app

[databases.postgresql.replica.database_options]
application_name = sqltoolkit-replica

[databases.postgresql.replica.session_settings]
; Mark the session replica at the database level.
search_path = app, public
statement_timeout = 15000
default_transaction_read_only = true
TimeZone = UTC

[databases.postgresql.replica.engine_options]
pool_size = 5
max_overflow = 10
pool_pre_ping = true
