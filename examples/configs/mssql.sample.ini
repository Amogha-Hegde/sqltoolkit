; MSSQL sample config for sqltoolkit.
; - session_settings: SET ... statements on connect
; - engine_options: SQLAlchemy create_engine()/pool kwargs

[databases.mssql.primary]
db_url = mssql+pyodbc://app_user:secret@localhost:1433/app?driver=ODBC+Driver+18+for+SQL+Server

[databases.mssql.primary.session_settings]
; String values are emitted as raw T-SQL tokens.
LOCK_TIMEOUT = 5000
XACT_ABORT = true
TRANSACTION ISOLATION LEVEL = READ COMMITTED

[databases.mssql.primary.engine_options]
pool_size = 10
max_overflow = 20
pool_pre_ping = true

[databases.mssql.replica]
db_url = mssql+pyodbc://replica_user:secret@localhost:1433/app?driver=ODBC+Driver+18+for+SQL+Server

[databases.mssql.replica.session_settings]
LOCK_TIMEOUT = 5000
XACT_ABORT = true
TRANSACTION ISOLATION LEVEL = READ UNCOMMITTED

[databases.mssql.replica.engine_options]
pool_size = 5
max_overflow = 10
pool_pre_ping = true
