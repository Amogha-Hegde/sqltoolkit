; MySQL sample config for sqltoolkit.
; - database_options: connection URL/query parameters
; - session_settings: per-connection MySQL session variables
; - engine_options: SQLAlchemy create_engine()/pool kwargs

[databases.mysql.default.readwrite]
db_url = mysql+pymysql://app_user:secret@localhost:3306/app

[databases.mysql.default.readwrite.database_options]
; charset is encoded onto the connection URL.
charset = utf8mb4

[databases.mysql.default.readwrite.session_settings]
; These become SET SESSION ....
sql_mode = STRICT_ALL_TABLES
time_zone = +00:00
innodb_lock_wait_timeout = 10
max_execution_time = 5000

[databases.mysql.default.readwrite.engine_options]
pool_size = 10
max_overflow = 20
pool_pre_ping = true
pool_recycle = 1800

[databases.mysql.default.readonly]
db_url = mysql+pymysql://readonly_user:secret@localhost:3306/app

[databases.mysql.default.readonly.database_options]
charset = utf8mb4

[databases.mysql.default.readonly.session_settings]
; transaction_read_only is a MySQL session variable.
sql_mode = STRICT_ALL_TABLES
time_zone = +00:00
transaction_read_only = 1

[databases.mysql.default.readonly.engine_options]
pool_size = 5
max_overflow = 10
pool_pre_ping = true
