; SQLite sample config for sqltoolkit.
; - session_settings: PRAGMA statements applied on connect
; - engine_options: SQLAlchemy create_engine()/pool kwargs

[databases.sqlite.default.readwrite]
file_path = ./data/app.db

[databases.sqlite.default.readwrite.session_settings]
; These become PRAGMA ... statements.
foreign_keys = true
journal_mode = WAL
busy_timeout = 5000

[databases.sqlite.default.readwrite.engine_options]
pool_pre_ping = true

[databases.sqlite.default.readonly]
file_path = ./data/app-readonly.db

[databases.sqlite.default.readonly.session_settings]
foreign_keys = true
busy_timeout = 5000

[databases.sqlite.default.readonly.engine_options]
pool_pre_ping = true
