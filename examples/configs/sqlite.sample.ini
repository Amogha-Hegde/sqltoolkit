; SQLite sample config for sqltoolkit.
; - session_settings: PRAGMA statements applied on connect
; - engine_options: SQLAlchemy create_engine()/pool kwargs

[databases.sqlite.default.primary]
file_path = ./data/app.db

[databases.sqlite.default.primary.session_settings]
; These become PRAGMA ... statements.
foreign_keys = true
journal_mode = WAL
busy_timeout = 5000

[databases.sqlite.default.primary.engine_options]
pool_pre_ping = true

[databases.sqlite.default.replica]
file_path = ./data/app-replica.db

[databases.sqlite.default.replica.session_settings]
foreign_keys = true
busy_timeout = 5000

[databases.sqlite.default.replica.engine_options]
pool_pre_ping = true
